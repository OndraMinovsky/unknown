<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Only Liquid Glass 💧📱</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --text-color: #1c1c1e;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
                --glass-bg: rgba(30, 30, 30, 0.55);
                --glass-border: rgba(255, 255, 255, 0.15);
                --text-color: #f9f9fb;
                --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            }
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            gap: 20px;
        }

        .glass-container {
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            border-radius: 24px; /* Zde můžeš změnit zakulacení (border-radius) */
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 300px;
            text-align: center;
        }

        select, button {
            appearance: auto;
            -webkit-appearance: auto;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 14px 18px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 14px; /* Zakulacení vnitřních prvků */
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }

        /* Skryto ve výchozím stavu, dokud JS nepotvrdí iOS */
        #app-content, #block-content {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Obsah pro iOS -->
    <div id="app-content" class="glass-container">
        <h2>iOS Liquid Glass 💧</h2>
        <select onchange="if(this.value) alert('Vybráno: ' + this.value)">
            <option value="" disabled selected>Vyber možnost...</option>
            <option value="Home">Home</option>
            <option value="Converter">Converter</option>
        </select>
        <button onclick="alert('Funguje na iOS!')">Akční tlačítko</button>
    </div>

    <!-- Blokovaný obsah pro jiné platformy -->
    <div id="block-content" class="glass-container">
        <h2>⚠️ Pouze pro iOS</h2>
        <p style="font-size: 14px; opacity: 0.8; margin: 0;">Tato webová stránka je dostupná pouze na zařízeních iPhone nebo iPad.</p>
    </div>

    <script>
        // Detekce iOS (iPhone, iPad, iPod)
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        if (isIOS) {
            document.getElementById('app-content').style.display = 'flex';
        } else {
            document.getElementById('block-content').style.display = 'flex';
        }
    </script>

</body>
</html>
