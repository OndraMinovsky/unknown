<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Liquid Glass TabBar 💧📱</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --text-color: #1c1c1e;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            --tabbar-bg: rgba(255, 255, 255, 0.75);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
                --glass-bg: rgba(30, 30, 30, 0.55);
                --glass-border: rgba(255, 255, 255, 0.15);
                --text-color: #f9f9fb;
                --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
                --tabbar-bg: rgba(30, 30, 30, 0.65);
            }
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            gap: 20px;
            overflow: hidden;
        }

        .glass-container {
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 300px;
            text-align: center;
            margin-bottom: 60px; /* Odsazení, aby obsah nebyl pod tab barem */
        }

        select, button {
            appearance: auto;
            -webkit-appearance: auto;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 14px 18px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }

        /* Skryté prvky do ověření */
        #loader-content, #app-content, #block-content {
            display: none;
        }

        /* Nativní iOS spinner */
        .ios-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(150, 150, 150, 0.2);
            border-top: 4px solid var(--text-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Spodní nativní iOS TabBar (Liquid Glass) */
        .ios-tabbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: var(--tabbar-bg);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 20px; /* Prostor pro domácí lištu na iPhonu */
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.05);
        }

        .tab-item {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s, transform 0.2s;
            padding: 6px 12px;
        }

        .tab-item.active {
            opacity: 1;
            font-weight: 600;
        }

        .tab-item:active {
            transform: scale(0.92);
        }

        .tab-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <!-- Načítací obrazovka -->
    <div id="loader-content" class="glass-container">
        <div class="ios-spinner"></div>
        <p style="font-size: 14px; margin: 0; opacity: 0.8;">Načítání Liquid Glass...</p>
    </div>

    <!-- Hlavní obsah pro iOS -->
    <div id="app-content" class="glass-container">
        <h2>iOS Liquid Glass 💧</h2>
        <select onchange="if(this.value) alert('Vybráno: ' + this.value)">
            <option value="" disabled selected>Vyber možnost...</option>
            <option value="Home">Home</option>
            <option value="Converter">Converter</option>
        </select>
        <button onclick="alert('Funguje na iOS!')">Akční tlačítko</button>
    </div>

    <!-- Blokovaný obsah pro jiné platformy -->
    <div id="block-content" class="glass-container">
        <h2>⚠️ Pouze pro iOS</h2>
        <p style="font-size: 14px; opacity: 0.8; margin: 0;">Tento web vyžaduje zařízení s iOS.</p>
    </div>

    <!-- Spodní nativní iOS TabBar -->
    <nav class="ios-tabbar" id="bottom-nav" style="display: none;">
        <button class="tab-item active" onclick="switchTab(this, 'Home')">
            <span class="tab-icon">🏠</span>
            <span>Home</span>
        </button>
        <button class="tab-item" onclick="switchTab(this, 'Explore')">
            <span class="tab-icon">✨</span>
            <span>Explore</span>
        </button>
        <button class="tab-item" onclick="switchTab(this, 'Settings')">
            <span class="tab-icon">⚙️</span>
            <span>Settings</span>
        </button>
    </nav>

    <script>
        document.getElementById('loader-content').style.display = 'flex';

        function checkiOSDevice() {
            const ua = navigator.userAgent;
            return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        }

        setTimeout(() => {
            document.getElementById('loader-content').style.display = 'none';

            if (checkiOSDevice()) {
                document.getElementById('app-content').style.display = 'flex';
                document.getElementById('bottom-nav').style.display = 'flex';
                alert("Welcome to the iOS liquid glass playground");
            } else {
                document.getElementById('block-content').style.display = 'flex';
            }
        }, 800);

        function switchTab(element, tabName) {
            // Změna aktivního stavu v tab baru
            document.querySelectorAll('.tab-item').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            alert('Přepnuto na záložku: ' + tabName);
        }
    </script>

</body>
</html>
