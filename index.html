<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>iOS 18 Native Liquid Glass 💧📱</title>
    <style>
        /* Použití reálných nativních systémových barev a chování iOS 18 */
        :root {
            color-scheme: light dark;
            --system-bg: canvas;
            --system-text: canvastext;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--system-bg);
            color: var(--system-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            gap: 20px;
            overflow: hidden;
            /* Povolení nativního chování iOS gest */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }

        /* Nativní Liquid Glass kontejner využívající systémové materiály Safari */
        .glass-container {
            background: rgba(255, 255, 255, 0.75);
            -webkit-backdrop-filter: blur(40px) saturate(190%);
            backdrop-filter: blur(40px) saturate(190%);
            border: 0.5px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border-radius: 28px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 320px;
            text-align: center;
            margin-bottom: 60px;
        }

        @media (prefers-color-scheme: dark) {
            .glass-container {
                background: rgba(30, 30, 30, 0.65);
                border: 0.5px solid rgba(255, 255, 255, 0.15);
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            }
        }

        /* Nativní systémové ovládací prvky Apple */
        select, button {
            font-family: inherit;
            appearance: none;
            -webkit-appearance: none;
            background-color: rgba(120, 120, 128, 0.12);
            border: none;
            color: var(--system-text);
            padding: 14px 18px;
            font-size: 17px;
            font-weight: 400;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            transition: opacity 0.15s ease;
        }

        select {
            text-align-last: center;
        }

        button:active, select:active {
            opacity: 0.6;
        }

        /* Skryté bloky pro logiku ověření */
        #loader-content, #app-content, #block-content {
            display: none;
        }

        /* Nativní iOS Activity Indicator (Spinner) */
        .ios-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(150, 150, 150, 0.2);
            border-top: 3px solid var(--system-text);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Nativní spodní TabBar stylizovaný dle iOS 18 */
        .ios-tabbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 84px;
            background: rgba(248, 248, 248, 0.8);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            backdrop-filter: blur(30px) saturate(200%);
            border-top: 0.5px solid rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            padding-top: 10px;
            padding-bottom: env(safe-area-inset-bottom);
        }

        @media (prefers-color-scheme: dark) {
            .ios-tabbar {
                background: rgba(22, 22, 22, 0.8);
                border-top: 0.5px solid rgba(255, 255, 255, 0.15);
            }
        }

        .tab-item {
            background: none;
            border: none;
            color: var(--system-text);
            font-size: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
            width: 33%;
        }

        .tab-item.active {
            opacity: 1;
            color: #007aff; /* Nativní iOS systémová modrá */
        }

        .tab-icon {
            font-size: 22px;
        }
    </style>
</head>
<body>

    <!-- Načítací obrazovka -->
    <div id="loader-content" class="glass-container">
        <div class="ios-spinner"></div>
        <p style="font-size: 15px; margin: 0; opacity: 0.6;">Načítání iOS 18...</p>
    </div>

    <!-- Hlavní obsah pro iOS 18+ -->
    <div id="app-content" class="glass-container">
        <h2 style="font-size: 20px; font-weight: 600; margin: 0 0 10px 0;">iOS 18 Playground 💧</h2>
        <select onchange="if(this.value) alert('Vybráno: ' + this.value)">
            <option value="" disabled selected>Navigační menu</option>
            <option value="Home">Home</option>
            <option value="Converter">Converter</option>
        </select>
        <button onclick="alert('Nativní prvek iOS 18 aktivní!')">Akční tlačítko</button>
    </div>

    <!-- Blokovaný obsah pro jiné platformy -->
    <div id="block-content" class="glass-container">
        <h2 style="font-size: 20px; font-weight: 600; margin: 0 0 10px 0;">⚠️ Omezeno</h2>
        <p style="font-size: 15px; opacity: 0.6; margin: 0;">Tato ukázka vyžaduje nativní prostředí iOS 18.</p>
    </div>

    <!-- Nativní spodní TabBar -->
    <nav class="ios-tabbar" id="bottom-nav" style="display: none;">
        <button class="tab-item active" onclick="switchTab(this, 'Home')">
            <span class="tab-icon">􀎞</span>
            <span>Domů</span>
        </button>
        <button class="tab-item" onclick="switchTab(this, 'Explore')">
            <span class="tab-icon">􀋄</span>
            <span>Prozkoumat</span>
        </button>
        <button class="tab-item" onclick="switchTab(this, 'Settings')">
            <span class="tab-icon">􀍟</span>
            <span>Nastavení</span>
        </button>
    </nav>

    <script>
        document.getElementById('loader-content').style.display = 'flex';

        function checkIOSDevice() {
            const ua = navigator.userAgent;
            return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        }

        setTimeout(() => {
            document.getElementById('loader-content').style.display = 'none';

            if (checkIOSDevice()) {
                document.getElementById('app-content').style.display = 'flex';
                document.getElementById('bottom-nav').style.display = 'flex';
                alert("Welcome to the iOS liquid glass playground");
            } else {
                document.getElementById('block-content').style.display = 'flex';
            }
        }, 800);

        function switchTab(element, tabName) {
            document.querySelectorAll('.tab-item').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            alert('Záložka: ' + tabName);
        }
    </script>

</body>
</html>
