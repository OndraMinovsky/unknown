<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS 26 Liquid Glass 💧📱</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --text-color: #1c1c1e;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
                --glass-bg: rgba(30, 30, 30, 0.55);
                --glass-border: rgba(255, 255, 255, 0.15);
                --text-color: #f9f9fb;
                --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            }
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            gap: 20px;
        }

        .glass-container {
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            border-radius: 24px; /* Zde můžeš upravit zakulacení rohů */
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 300px;
            text-align: center;
        }

        select, button {
            appearance: auto;
            -webkit-appearance: auto;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 14px 18px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }

        /* Skryté prvky do ověření systému */
        #loader-content, #app-content, #block-content {
            display: none;
        }

        /* Nativní styl pro iOS spinner (ProgressRing / Activity Indicator) */
        .ios-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(150, 150, 150, 0.2);
            border-top: 4px solid var(--text-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Načítací obrazovka s nativním iOS spinnerem -->
    <div id="loader-content" class="glass-container">
        <div class="ios-spinner"></div>
        <p style="font-size: 14px; margin: 0; opacity: 0.8;">Ověřování systému iOS 26+...</p>
    </div>

    <!-- Hlavní obsah pro iOS 26+ -->
    <div id="app-content" class="glass-container">
        <h2>iOS 26 Liquid Glass 💧</h2>
        <select onchange="if(this.value) alert('Vybráno: ' + this.value)">
            <option value="" disabled selected>Vyber možnost...</option>
            <option value="Home">Home</option>
            <option value="Converter">Converter</option>
        </select>
        <button onclick="alert('Funguje na iOS 26+!')">Akční tlačítko</button>
    </div>

    <!-- Blokovaný obsah pro staré iOS nebo jiné platformy -->
    <div id="block-content" class="glass-container">
        <h2>⚠️ Vyžadován iOS 26+</h2>
        <p style="font-size: 14px; opacity: 0.8; margin: 0;">Tento web vyžaduje zařízení s operačním systémem iOS 26 nebo novějším.</p>
    </div>

        <script>
        // Zobrazíme spinner jako první
        document.getElementById('loader-content').style.display = 'flex';

        // Detekce iOS zařízení
        function checkiOSVersion() {
            const ua = navigator.userAgent;
            const isIOSDevice = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            
            // Pro účely testování teď ověřujeme pouze to, zda jde o iOS zařízení
            return isIOSDevice;
        }

        // Krátká prodleva se spinnerem (0.8 sekundy) a spuštění
        setTimeout(() => {
            document.getElementById('loader-content').style.display = 'none';

            if (checkiOSVersion()) {
                document.getElementById('app-content').style.display = 'flex';
                // Uvítací alert
                alert("Welcome to the iOS Liquid Glass Playground!");
            } else {
                document.getElementById('block-content').style.display = 'flex';
            }
        }, 800);
    </script>


</body>
</html>
