<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nativní prvky 📱</title>
</head>
<body>

    <!-- Nativní systémový select (dropdown) -->
    <select onchange="if(this.value) alert('Vybráno: ' + this.value)">
        <option value="" disabled selected>Navigation Menu</option>
        <option value="Home">Home</option>
        <option value="Converter">Converter</option>
        <option value="Base64 Decode">- Base64 Decode</option>
        <option value="ASCII">-- ASCII</option>
        <option value="Audio">-- Audio</option>
        <option value="Basic Auth">-- Basic Auth</option>
        <option value="File">-- File</option>
        <option value="Hex">-- Hex</option>
        <option value="Image">-- Image</option>
        <option value="BMP">--- BMP</option>
        <option value="GIF">--- GIF</option>
    </select>

    <!-- Nativní systémové tlačítko -->
    <button onclick="alert('Nativní tlačítko stisknuto!')">Tlačítko</button>

</body>
</html>
