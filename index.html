<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatický Dark/Light Mode 🌗</title>
    <style>
        /* Definice barevných palet pomocí CSS proměnných */
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
        }

        /* Pokud má uživatel v systému zapnutý Dark Mode */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #ffffff;
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            gap: 20px;
            transition: background 0.3s, color 0.3s;
        }

        /* Nativní styly pro prvky, aby hezky vypadaly v obou režimech */
        select, button {
            padding: 10px 16px;
            font-size: 16px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>Automatický režim dle systému 📱</h1>

    <select>
        <option value="" disabled selected>Navigation Menu</option>
        <option value="Home">Home</option>
        <option value="Converter">Converter</option>
    </select>

    <button onclick="alert('Funguje to!')">Tlačítko</button>

</body>
</html>
